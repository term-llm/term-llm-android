name: Android build (manual self-hosted)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: [self-hosted, linux, x64, android-kvm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build account-free container
        run: docker build -t android-check .
      - name: Unit, release lint and R8
        run: docker run --rm --cpus=4 --memory=12g android-check
      - name: Emulator suite (requires KVM)
        run: |
          test -c /dev/kvm
          docker run --rm --device /dev/kvm --cpus=4 --memory=12g -e TEST_SECRETS_DIR=/tmp/android-fixtures android-check testing/verify-device.sh
